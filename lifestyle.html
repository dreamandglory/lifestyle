<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="KYqpgtMiaGxCZI7IHJS9Mv">
<head data-page-node-id="1etMGnlNwL12aMy9Hhn6YS">
<meta charset="UTF-8" data-page-node-id="76A3aNON7M0zap6vHCurnc">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="IJG8PaBpRszjR4UVA0nCbq">
<title>人生方向定制问卷 · 致迷茫的你</title>
<style>
  :root{
    --bg:#f6f8fb;
    --card:#ffffff;
    --ink:#1f2a37;
    --ink-soft:#5b6b7c;
    --ink-faint:#8b98a8;
    --line:#e7ecf2;
    --brand:#3b82c4;
    --brand-deep:#2c6ba6;
    --brand-soft:#e8f2fb;
    --mint:#37b39a;
    --mint-soft:#e5f6f2;
    --amber:#f0a13a;
    --amber-soft:#fdf3e3;
    --coral:#ef6a6a;
    --coral-soft:#fdeaea;
    --violet:#8b7bd8;
    --violet-soft:#f0edfb;
    --radius:18px;
    --shadow:0 10px 30px rgba(31,42,55,.06);
    --shadow-lg:0 18px 50px rgba(31,42,55,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px}

  /* progress */
  .progress-wrap{position:fixed;top:0;left:0;right:0;height:5px;background:transparent;z-index:50}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--mint),var(--brand));width:0%;transition:width .4s ease;border-radius:0 4px 4px 0}

  .screen{width:100%;max-width:640px;animation:fadeUp .45s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  /* hero / welcome */
  .hero{background:var(--card);border-radius:24px;padding:44px 34px;box-shadow:var(--shadow);text-align:center;margin-top:20px}
  .hero .badge{display:inline-block;background:var(--mint-soft);color:var(--mint);font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;margin-bottom:20px;letter-spacing:.5px}
  .hero h1{font-size:30px;line-height:1.3;margin-bottom:14px;font-weight:800}
  .hero h1 em{font-style:normal;color:var(--brand)}
  .hero p.sub{color:var(--ink-soft);font-size:15px;margin-bottom:28px}
  .hero .meta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
  .hero .meta span{background:var(--bg);border:1px solid var(--line);color:var(--ink-soft);font-size:12.5px;padding:6px 12px;border-radius:999px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--brand);color:#fff;border:none;cursor:pointer;
    font-size:16px;font-weight:600;padding:14px 34px;border-radius:14px;
    transition:transform .15s ease,background .15s ease,box-shadow .15s ease;
    box-shadow:0 8px 20px rgba(59,130,196,.28);
  }
  .btn:hover{background:var(--brand-deep);transform:translateY(-2px)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:var(--bg);color:var(--ink-soft);box-shadow:none;border:1px solid var(--line)}
  .btn.ghost:hover{background:#eef2f6}
  .btn.mint{background:var(--mint);box-shadow:0 8px 20px rgba(55,179,154,.28)}
  .btn.mint:hover{background:#2fa78e}

  /* question card */
  .q-card{background:var(--card);border-radius:24px;padding:34px 30px;box-shadow:var(--shadow);margin-top:20px}
  .q-sec{font-size:12.5px;font-weight:700;letter-spacing:.5px;color:var(--brand);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .q-sec .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
  .q-sec.tone2{color:var(--mint)}.q-sec.tone2 .dot{background:var(--mint)}
  .q-sec.tone3{color:var(--amber)}.q-sec.tone3 .dot{background:var(--amber)}
  .q-sec.tone4{color:var(--violet)}.q-sec.tone4 .dot{background:var(--violet)}
  .q-title{font-size:21px;font-weight:700;line-height:1.45;margin-bottom:6px}
  .q-hint{font-size:14px;color:var(--ink-faint);margin-bottom:22px}
  .q-index{color:var(--ink-faint);font-size:13px;margin-bottom:4px;font-weight:600}

  /* options */
  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{
    display:flex;align-items:center;gap:14px;padding:14px 16px;
    border:1.5px solid var(--line);border-radius:14px;cursor:pointer;
    transition:border-color .15s ease,background .15s ease,transform .12s ease;
    background:#fff;text-align:left;font-size:15.5px;color:var(--ink);width:100%;
  }
  .opt:hover{border-color:#c6d6e6;background:#fafcfe}
  .opt.sel{border-color:var(--brand);background:var(--brand-soft)}
  .opt .mark{
    width:22px;height:22px;border-radius:50%;border:2px solid #cdd7e0;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;
    transition:all .15s ease;
  }
  .opt.sel .mark{background:var(--brand);border-color:var(--brand)}
  .opt .mark::after{content:"✓";opacity:0;transition:opacity .15s}
  .opt.sel .mark::after{opacity:1}
  .opt.multi .mark{border-radius:6px}
  .opt .emoji{font-size:22px;flex:none}

  /* scale */
  .scale{display:flex;flex-direction:column;gap:9px}
  .scale .opt{padding:13px 16px}

  /* tradeoffs */
  .trade{display:flex;flex-direction:column;gap:16px;margin-top:4px}
  .trade-item{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px}
  .trade-label{font-size:13px;color:var(--ink-faint);font-weight:600;margin-bottom:10px}
  .trade-pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
  .trade-opt{
    padding:12px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;
    text-align:center;font-size:14px;background:#fff;transition:all .15s ease;color:var(--ink);
  }
  .trade-opt:hover{border-color:#c6d6e6}
  .trade-opt.sel{border-color:var(--mint);background:var(--mint-soft);color:var(--ink);font-weight:600}
  .trade-vs{color:var(--ink-faint);font-size:12px;font-weight:700;flex:none}

  /* open */
  textarea{
    width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:14px;
    padding:14px 16px;font-size:15px;font-family:inherit;color:var(--ink);resize:vertical;
    background:#fbfcfe;transition:border-color .15s ease;line-height:1.6;
  }
  textarea:focus{outline:none;border-color:var(--brand);background:#fff}
  textarea::placeholder{color:#b6c0cc}

  /* nav */
  .nav{display:flex;justify-content:space-between;margin-top:26px;gap:12px}
  .nav .btn{flex:1}
  .nav .btn:only-child{max-width:200px;margin-left:auto}

  /* echo 若隐若现的文艺提示 */
  .echo{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    max-width:min(84vw,560px);text-align:center;font-size:13.5px;
    color:var(--ink-faint);font-style:italic;letter-spacing:.5px;line-height:1.7;
    opacity:0;transition:opacity 1.3s ease;pointer-events:none;z-index:40;
    background:rgba(255,255,255,.78);backdrop-filter:blur(5px);
    padding:9px 18px;border-radius:999px;box-shadow:0 6px 24px rgba(31,42,55,.08);
  }
  .echo.show{opacity:.92}

  /* result */
  .result{width:100%;max-width:700px;animation:fadeUp .5s ease}
  .r-hero{background:linear-gradient(135deg,#3b82c4,#37b39a);border-radius:24px;padding:40px 32px;color:#fff;text-align:center;box-shadow:var(--shadow-lg);margin-top:16px}
  .r-hero .r-tag{font-size:13px;opacity:.9;letter-spacing:1px;font-weight:600;margin-bottom:10px}
  .r-hero h2{font-size:27px;font-weight:800;margin-bottom:10px}
  .r-hero .type-chip{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:8px 18px;border-radius:999px;font-size:15px;font-weight:700;margin:4px}
  .r-hero p{font-size:14.5px;opacity:.92;margin-top:14px;max-width:480px;margin-left:auto;margin-right:auto}

  .r-card{background:var(--card);border-radius:20px;padding:28px 26px;box-shadow:var(--shadow);margin-top:18px}
  .r-card h3{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:9px}
  .r-card h3 .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .ic.mint{background:var(--mint-soft)} .ic.blue{background:var(--brand-soft)} .ic.amber{background:var(--amber-soft)} .ic.violet{background:var(--violet-soft)} .ic.coral{background:var(--coral-soft)}

  .bars{display:flex;flex-direction:column;gap:11px}
  .bar-row{display:grid;grid-template-columns:88px 1fr 40px;align-items:center;gap:10px}
  .bar-name{font-size:13px;color:var(--ink-soft);text-align:right}
  .bar-track{height:12px;background:var(--bg);border-radius:999px;overflow:hidden}
  .bar-fill{height:100%;border-radius:999px;transition:width .8s cubic-bezier(.22,1,.36,1)}
  .bar-val{font-size:12px;color:var(--ink-faint);font-weight:600}
  .bar-row.top .bar-name{color:var(--ink);font-weight:700}
  .bar-row.top .bar-val{color:var(--brand);font-weight:700}

  .keywords{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .kw{background:var(--violet-soft);color:#6a58c0;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700}
  .kw.alt{background:var(--mint-soft);color:var(--mint)}

  .list{display:flex;flex-direction:column;gap:10px}
  .list-item{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:var(--ink-soft)}
  .list-item .n{flex:none;width:24px;height:24px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}

  .quote{background:var(--bg);border-left:4px solid var(--mint);border-radius:12px;padding:16px 18px;font-size:14.5px;color:var(--ink-soft);margin-bottom:12px;white-space:pre-wrap}
  .quote .ql{color:var(--ink-faint);font-size:12.5px;font-weight:700;margin-bottom:6px;letter-spacing:.5px}

  .res-item{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
  .res-item .tag{flex:none;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px;margin-top:2px}
  .tag.book{background:var(--brand-soft);color:var(--brand)}
  .tag.film{background:var(--violet-soft);color:#6a58c0}
  .tag.ex{background:var(--amber-soft);color:#c77f1a}
  .res-item .txt{font-size:14px;color:var(--ink-soft)}

  .assess{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .pill{font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink-soft)}
  .pill strong{color:var(--ink)}

  .r-foot{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
  .foot-note{text-align:center;color:var(--ink-faint);font-size:12px;margin-top:18px;max-width:560px;margin-left:auto;margin-right:auto}

  /* endings */
  .ending{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;background:#fff;transition:border-color .15s ease}
  .ending.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .end-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .end-tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:7px;letter-spacing:.3px}
  .end-tag.light{background:var(--mint-soft);color:var(--mint)}
  .end-tag.warm{background:var(--amber-soft);color:#c77f1a}
  .end-tag.dark{background:var(--coral-soft);color:var(--coral)}
  .end-prob{font-size:13px;font-weight:700;color:var(--ink-soft)}
  .end-track{height:8px;background:var(--bg);border-radius:999px;overflow:hidden;margin-bottom:12px}
  .end-fill{height:100%;border-radius:999px;transition:width .8s cubic-bezier(.22,1,.36,1)}
  .end-title{font-size:16px;font-weight:700;margin-bottom:6px}
  .end-story{font-size:14px;color:var(--ink-soft);line-height:1.7}
  .end-case{font-size:13px;color:var(--ink-faint);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);line-height:1.6}
  /* 结局表格 */
  .end-scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
  .end-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:600px}
  .end-table th{background:var(--bg);color:var(--ink-faint);font-weight:700;padding:10px 12px;text-align:left;font-size:12.5px;letter-spacing:.3px;white-space:nowrap}
  .end-table th:first-child{border-radius:10px 0 0 10px}
  .end-table th:last-child{border-radius:0 10px 10px 0}
  .end-table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
  tr.end-group td{background:var(--bg);color:var(--ink-soft);font-weight:700;font-size:12.5px;padding:8px 12px;letter-spacing:.5px;border-bottom:none}
  tr.end-row{cursor:pointer;transition:background .15s}
  tr.end-row:hover td{background:#fafcfe}
  tr.end-row.sel td{background:var(--brand-soft)}
  .rank-badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
  .rank-badge.perfect{background:var(--amber-soft);color:#c77f1a}
  .rank-badge.good{background:var(--mint-soft);color:var(--mint)}
  .rank-badge.hidden{background:var(--violet-soft);color:#6a58c0}
  .rank-badge.normal{background:var(--bg);color:var(--ink-soft);border:1px solid var(--line)}
  .rank-badge.bad{background:var(--coral-soft);color:var(--coral)}
  .rank-badge.worst{background:#3b2730;color:#ffb3b3}
  .end-name{font-weight:700;color:var(--ink);font-size:14px;white-space:nowrap}
  .end-cond{color:var(--ink-soft);font-size:12.5px}
  .end-prob-cell{color:var(--ink-faint);font-size:11.5px;font-weight:600;margin-top:6px}
  .end-story-t{color:var(--ink-soft);line-height:1.6;font-size:13.5px}
  .end-case-t{color:var(--ink-faint);font-size:12.5px;margin-top:5px;line-height:1.5}
  /* MBTI 类型 */
  .mbti{display:flex;justify-content:center;gap:10px;margin-bottom:6px}
  .mbti-letter{background:var(--violet-soft);border-radius:14px;padding:10px 0;width:64px;text-align:center}
  .mbti-ch{font-size:24px;font-weight:800;color:#6a58c0}
  .mbti-lb{font-size:11.5px;color:#8b7bd8}
  .advice{margin-top:12px;padding:12px 14px;background:var(--bg);border-radius:12px;font-size:14px;color:var(--ink-soft)}
  .endings-note{font-size:12px;color:var(--ink-faint);margin-top:6px;line-height:1.6}
  .reflect-q{font-size:14.5px;color:var(--ink-soft);margin-bottom:14px}
  .reflect-reply{background:linear-gradient(135deg,var(--brand-soft),var(--mint-soft));border-radius:14px;padding:18px;font-size:14.5px;color:var(--ink);line-height:1.8}
  /* 回顾答案 */
  .review-summary{cursor:pointer;font-size:15px;font-weight:700;color:var(--ink);list-style:none;display:flex;align-items:center;gap:8px}
  .review-summary::-webkit-details-marker{display:none}
  .review-summary::after{content:"▾";color:var(--ink-faint);font-size:13px;transition:transform .2s}
  details[open] .review-summary::after{transform:rotate(180deg)}
  .review-list{margin-top:14px;display:flex;flex-direction:column;gap:10px;max-height:440px;overflow-y:auto;padding-right:4px}
  .review-item{background:var(--bg);border-radius:12px;padding:12px 14px}
  .review-q{font-size:13px;color:var(--ink-faint);margin-bottom:4px}
  .review-a{font-size:14.5px;color:var(--ink);font-weight:600;line-height:1.6}

  @media(max-width:480px){
    .hero{padding:32px 22px}
    .q-card{padding:26px 20px}
    .q-title{font-size:19px}
    .bar-row{grid-template-columns:72px 1fr 32px}
  }
</style>
</head>

<script>
/* ============ 类型定义 ============ */
const BAD_KEYS = ['goal','meaning','involution','choice','gap','doubt','family','burnout','lonely','perfect','scattered','money'];
const GOOD_KEYS = ['sunny','relaxed','grateful','clear','proactive','decisive','confident','independent','warm','resilient','energetic','curious'];
const TYPE_KEYS = [...BAD_KEYS, ...GOOD_KEYS];
const TYPE_NAMES = {
  goal:'目标缺失', meaning:'意义缺失', involution:'内卷焦虑', choice:'选择困难',
  gap:'现实落差', doubt:'自我怀疑', family:'家庭期待冲突', burnout:'倦怠麻木',
  lonely:'社交孤独', perfect:'完美主义', scattered:'兴趣发散', money:'经济焦虑',
  sunny:'阳光乐观', relaxed:'松弛从容', grateful:'知足感恩', clear:'清晰坚定',
  proactive:'行动进取', decisive:'果断勇敢', confident:'自洽自信', independent:'独立自主',
  warm:'温暖连接', resilient:'坚韧抗压', energetic:'能量充沛', curious:'探索好奇'
};
const TYPE_COLORS = {
  goal:'#3b82c4', meaning:'#37b39a', involution:'#ef6a6a', choice:'#f0a13a',
  gap:'#8b7bd8', doubt:'#5b6b7c', family:'#e0873f', burnout:'#9aa7b5',
  lonely:'#5b8def', perfect:'#c06090', scattered:'#4caf7f', money:'#c9973b',
  sunny:'#f6a623', relaxed:'#4db6ac', grateful:'#f28e6e', clear:'#2f9bd8',
  proactive:'#e8674d', decisive:'#d97706', confident:'#7c5cbf', independent:'#3e7cb1',
  warm:'#e05d7a', resilient:'#2f855a', energetic:'#f97316', curious:'#14b8a6'
};

const TYPE_CONTENT = {
  goal:{
    name:'目标缺失', tag:'方向模糊型', short:'你心里有方向感，只是还没找到具体的目标。',
    insight:'你不是不想努力，而是不知道该往哪个方向使劲——没有靶子，箭就射不出去。这种迷茫往往来自"被安排惯了"：从小到大，升学、考试都是别人定好的路，一旦轮到你自己选，反而手足无措。',
    actions:['做一次「兴趣 × 能力 × 价值」三圈交集练习，写下 5 个你既不讨厌、做得不差、又觉得有意义的方向','用「最小可行尝试」代替空想：选一个方向，花 1–2 周做个小项目/实习/旁听，用行动试错','别再等"想清楚再动"，方向是边走边清晰的','和 3 个你欣赏的人聊聊他们的路径，收集真实样本'],
    resources:[{t:'book',x:'《斯坦福大学人生设计课》'},{t:'film',x:'电影《心灵奇旅》(Soul)'},{t:'ex',x:'练习：写下你的人生罗盘（价值观+兴趣+能力）'}]
  },
  meaning:{
    name:'意义缺失', tag:'空心感型', short:'你不是不够好，是暂时找不到"为什么要做"。',
    insight:'成绩、证书、offer 都有了，内心却空空的。这种"空"不是矫情，而是长期把外在评价当成内在动力后，真实的自己很久没被听见了。你需要的不是更多成就，而是重新和自己建立连接。',
    actions:['停一停"应该做什么"，每天写一条"今天让我有一点点感觉的事"','从"别人的标准"里抽身，问自己：如果没有观众，我还想做这件事吗','尝试一件纯粹"没有用"、但让你开心的事','如果长期低落、对一切失去兴趣，请勇敢寻求心理咨询——这不是脆弱'],
    resources:[{t:'book',x:'维克多·弗兰克尔《活出生命的意义》'},{t:'film',x:'电影《死亡诗社》'},{t:'ex',x:'练习：写给 5 年后的自己的一封信'}]

function pickRand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function echoForOption(o){
  if(o && o.map){
    let best=null, bestV=-1;
    for(const k in o.map){ if(o.map[k]>bestV){ bestV=o.map[k]; best=k; } }
    if(best && TYPE_ECHO[best]) return TYPE_ECHO[best];
  }
  return pickRand(ECHO_GENERIC);
}
function showEcho(text){
  const el = document.getElementById('echo');
  if(!el) return;
  clearTimeout(echoTimer); clearTimeout(echoHideTimer);
  el.textContent = text;
  el.classList.add('show');
  echoHideTimer = setTimeout(()=>{ el.classList.remove('show'); }, 3400);

function qById(id){ return QUESTIONS.find(q=>q.id===id); }

function addMap(scores, map){ if(!map) return; for(const k in map){ scores[k]=(scores[k]||0)+map[k]; } }

function start(){
  state.idx=0; state.answers={}; state.phase='core';
  state.total = CORE_QUESTIONS.length + BRANCH_COUNT;
  reflect.picked=null; reflect.text=''; reflect.submitted=false;
  order = shuffle(CORE_QUESTIONS);
  state.maxIdx = order.length-1;
  const e=document.getElementById('echo'); if(e){ e.classList.remove('show'); e.textContent=''; }
  renderQuestion();
}

function renderQuestion(){
  if(state.idx > state.maxIdx){ renderResult(); return; }
  clearTimeout(echoTimer);
  const q = order[state.idx];
  const pct = Math.round((state.idx / state.total) * 100);
  progressBar.style.width = pct + '%';
  const tone = q.secTone===2?'tone2':q.secTone===3?'tone3':q.secTone===4?'tone4':'';
  let body = '';
  const ans = state.answers[q.id];

  if(q.type==='single' || q.type==='scene'){
    body = `<div class="opts">` + q.options.map((o,i)=>`
      <button class="opt ${ans===i?'sel':''}" onclick="pick('${q.id}',${i})">
        <span class="mark"></span><span>${o.label}</span>
      </button>`).join('') + `</div>`;
  } else if(q.type==='multi'){
    const sel = ans || [];
    body = `<div class="opts">` + q.options.map((o,i)=>`
      <button class="opt multi ${sel.includes(i)?'sel':''}" onclick="pickMulti('${q.id}',${i},${q.max||999})">
        <span class="mark"></span><span>${o.label}</span>
      </button>`).join('') + `</div>`;
  } else if(q.type==='tradeoffs'){
    const sel = ans || [null,null,null];
    body = `<div class="trade">` + q.pairs.map((p,pi)=>`
      <div class="trade-item">
        <div class="trade-label">第 ${pi+1} 组</div>
        <div class="trade-pair">
          <div class="trade-opt ${sel[pi]===0?'sel':''}" onclick="pickTrade('${q.id}',${pi},0)">${p.a.label}</div>
          <div class="trade-vs">VS</div>
          <div class="trade-opt ${sel[pi]===1?'sel':''}" onclick="pickTrade('${q.id}',${pi},1)">${p.b.label}</div>
        </div>
      </div>`).join('') + `</div>`;
  } else if(q.type==='open'){
    body = `<textarea placeholder="${q.placeholder||''}" oninput="pickOpen('${q.id}',this.value)">${ans||''}</textarea>`;
  }

  const isLast = state.idx===state.maxIdx && state.phase==='branch';
  const canNext = isAnswered(q, ans);
  app.innerHTML = `
  <div class="screen">
    <div class="q-card">
      <div class="q-index">${state.idx+1} / ${state.total}</div>
      <div class="q-sec ${tone}"><span class="dot"></span>${q.sec}</div>
      <div class="q-title">${q.title}</div>
      ${q.hint?`<div class="q-hint">${q.hint}</div>`:''}
      ${body}
      <div class="nav">
        ${state.idx>0?`<button class="btn ghost" onclick="prev()">← 上一题</button>`:`<button class="btn ghost" style="visibility:hidden">←</button>`}
        <button class="btn ${isLast?'mint':''}" ${canNext?'':`disabled style="opacity:.45;cursor:not-allowed"`} onclick="next()">${isLast?'生成我的报告 ✨':'下一题 →'}</button>
      </div>
    </div>
  </div>`;

  // 迟迟未选择时，若隐若现地浮出一句
  echoTimer = setTimeout(()=>{
    const el = document.getElementById('echo');
    if(el && !el.classList.contains('show')){ el.textContent = pickRand(HESITATE_LINES); el.classList.add('show'); }
  }, 4600);
}

function isAnswered(q, ans){
  if(q.type==='open') return ans && ans.trim().length>0;
  if(q.type==='tradeoffs') return (ans||[]).every(v=>v!==null && v!==undefined);
  if(q.type==='multi') return (ans||[]).length>0;
  return ans!==null && ans!==undefined;
}

function pick(id,i){ state.answers[id]=i; const q=qById(id); showEcho(echoForOption(q&&q.options[i])); renderQuestion(); }
function pickMulti(id,i,max){ let a=state.answers[id]||[]; if(a.includes(i)){ a=a.filter(x=>x!==i); } else { if(a.length<max) a=[...a,i]; } state.answers[id]=a; const q=qById(id); showEcho(echoForOption(q&&q.options[i])); renderQuestion(); }
function pickTrade(id,pi,val){ let a=state.answers[id]||[null,null,null]; a[pi]=val; state.answers[id]=a; const q=qById(id); const opt=q&&q.pairs[pi]&&(val===0?q.pairs[pi].a:q.pairs[pi].b); showEcho(echoForOption(opt)); renderQuestion(); }
function pickOpen(id,val){
  const wasEmpty = !(state.answers[id] && state.answers[id].trim());
  state.answers[id]=val;
  // 主观题输入时实时刷新「下一题」按钮状态，避免答完仍按不动
  const btn = document.querySelector('.nav .btn:not(.ghost)');
  if(btn){
    const ok = val && val.trim().length>0;
    btn.disabled = !ok;
    btn.style.opacity = ok ? '' : '.45';
    btn.style.cursor = ok ? '' : 'not-allowed';
  }
  if(wasEmpty && val && val.trim().length>0){ showEcho(pickRand(['你在写下自己的答案，很好。','有些话，说出来就是第一步。','写下来，它就不再只是情绪。'])); }
}
function next(){
  state.idx++;
  if(state.idx > state.maxIdx){
    if(state.phase==='core'){ beginBranches(); return; }
    renderResult(); return;
  }
  renderQuestion();
}
function prev(){ state.idx--; renderQuestion(); }

function branchWeights(scores){
  const w = {};
  BAD_KEYS.slice().sort((a,b)=>scores[b]-scores[a]).slice(0,3).forEach((t,i)=> w[t]=[5,3,2][i]);
  GOOD_KEYS.slice().sort((a,b)=>scores[b]-scores[a]).slice(0,3).forEach((t,i)=> w[t]=[5,3,2][i]);
  return w;
}
function questionKeys(q){
  const keys = new Set();
  (q.options||[]).forEach(o=>{ if(o.map) Object.keys(o.map).forEach(k=>keys.add(k)); });
  (q.pairs||[]).forEach(p=>{ [p.a,p.b].forEach(o=>{ if(o&&o.map) Object.keys(o.map).forEach(k=>keys.add(k)); }); });
  return [...keys];
}
function selectBranches(w){
  const scored = BRANCH_QUESTIONS.map(q=>{
    let rel = 0; questionKeys(q).forEach(k=> rel += (w[k]||0));
    return { q, rel };
  });
  scored.sort((a,b)=> b.rel - a.rel);
  const chosen = scored.slice(0, BRANCH_COUNT).map(x=>x.q);
  const rest = scored.slice(BRANCH_COUNT).map(x=>x.q);
  let i = 0;
  while(chosen.length < BRANCH_COUNT && i < rest.length){ chosen.push(rest[i++]); }
  return chosen;
}
function beginBranches(){
  const scores = computeScores();
  const w = branchWeights(scores);
  const selected = selectBranches(w);
  state.phase = 'branch';
  order = order.concat(shuffle(selected));
  state.maxIdx = order.length - 1;
  renderQuestion();
}

/* ============ 结果计算 ============ */
function computeScores(){
  const scores = {}; TYPE_KEYS.forEach(t=>scores[t]=0);
  for(const q of QUESTIONS){
    const ans = state.answers[q.id];
    if(ans===null || ans===undefined) continue;
    if(q.type==='single' || q.type==='scene'){ addMap(scores, q.options[ans]&&q.options[ans].map); }
    else if(q.type==='multi'){ (ans||[]).forEach(i=>addMap(scores, q.options[i]&&q.options[i].map)); }
  }
  return scores;
}

function extractValues(){
  const values = [];
  const q8 = QUESTIONS.find(q=>q.id==='q8');
  (state.answers['q8']||[]).forEach(i=>{ const o=q8.options[i]; if(o.valueKey) values.push({key:o.valueKey,label:o.label}); });
  const q9 = QUESTIONS.find(q=>q.id==='q9');
  (state.answers['q9']||[]).forEach((choice,pi)=>{ if(choice!==null && choice!==undefined){ const p=q9.pairs[pi][choice===0?'a':'b']; values.push({key:p.valueKey,label:p.label}); } });
  return values;
}

function energyLevel(){
  const a16 = state.answers['q16'], a17 = state.answers['q17'];
  if(a16===0 || a17===0) return 'high';
  if((a16===3) || (a17===3)) return 'low';
  return 'mid';
}

function supportLevel(){
  const a19 = state.answers['q19'], a20 = state.answers['q20']||[];
  const selfOnly = a20.length===1 && a20[0]===3;
  if(a19===0 || a19===1){ return selfOnly?'mid':'strong'; }
  if(a19===3 || a19===2){ return 'weak'; }
  return 'mid';
}

const DIM_DEFS = [
  ['A','行动派','R','沉思派'],
  ['V','远见型','P','务实型'],
  ['T','理性','F','感性'],
  ['E','探索','S','安定']
];
function deriveType16(){
  const a = state.answers;
  let actionScore = 0;
  if(a['q16']===0) actionScore++;
  if(a['q17']===0) actionScore++;
  const d1 = actionScore>=1 ? 'A':'R';
  const d2 = (a['q3']===2 || a['q3']===4 || a['q12']===3) ? 'V':'P';
  const T_KEYS = {wealth:1, achievement:1, impact:1};
  const F_KEYS = {meaning:1, relation:1, explore:1, balance:1, freedom:1};
  let t=0, f=0;
  const q8 = QUESTIONS.find(q=>q.id==='q8');
  (a['q8']||[]).forEach(i=>{ const k=q8.options[i].valueKey; if(T_KEYS[k])t++; if(F_KEYS[k])f++; });
  const q9 = QUESTIONS.find(q=>q.id==='q9');
  (a['q9']||[]).forEach((c,pi)=>{ if(c===0||c===1){ const k=q9.pairs[pi][c===0?'a':'b'].valueKey; if(T_KEYS[k])t++; if(F_KEYS[k])f++; } });
  const d3 = t>=f ? 'T':'F';
  let e=0, s=0;
  if(a['q9'] && a['q9'][1]===1) e++;
  if(a['q9'] && a['q9'][1]===0) s++;
  if(a['q12']===3 || a['q12']===1) e++;
  if(a['q12']===2) s++;
  const d4 = e>=s ? 'E':'S';
  const dims = [d1,d2,d3,d4];
  const code = dims.join('');
  return {code, dims, ...TYPE16[code]};
}
function type16HTML(){
  const t = deriveType16();
  const blocks = t.dims.map((d,i)=>{ const def=DIM_DEFS[i]; return `<div class="mbti-letter"><div class="mbti-ch">${d}</div><div class="mbti-lb">${d===def[0]?def[1]:def[3]}</div></div>`; }).join('');
  return `
    <div class="r-card">
      <h3><span class="ic violet">🧬</span>你的「人生取向类型」（MBTI 式）</h3>
      <div class="mbti">${blocks}</div>
      <div style="text-align:center;margin:8px 0 14px">
        <div style="font-size:20px;font-weight:800;color:var(--ink)">${t.name}</div>
        <div style="font-size:14px;color:var(--ink-soft)">${t.tag}</div>
      </div>
      <div style="font-size:14.5px;color:var(--ink-soft)">${t.desc}</div>
      <div class="advice"><strong>给你的建议：</strong>${t.advice}</div>
    </div>`;
}

/* ============ 好/坏结局表 + 共鸣反思 ============ */
function getAllEndings(type){
  const all = [...(ENDINGS[type]||[]), ...(EXTRA[type]||[])];
  const groups = {light:[], warm:[], dark:[]};
  all.forEach(e=>{ (groups[e.tone]||(groups[e.tone]=[])).push(e); });
  return groups;
}
function flatEndings(type){
  const g = getAllEndings(type);
  const out = [];
  g.light.forEach(e=>out.push({...e, group:'light'}));
  g.warm.forEach(e=>out.push({...e, group:'warm'}));
  g.dark.forEach(e=>out.push({...e, group:'dark'}));
  return out;
}
function isGoodType(type){ return GOOD_KEYS.indexOf(type)>=0; }
function groupConfig(isGood){
  return isGood ? [
    {tone:'light', title:'保持 · 放大你的光', cond:'当你保持并放大这份特质'},
    {tone:'warm', title:'顺其自然', cond:'当你顺其自然、不加经营'},
    {tone:'dark', title:'失衡 · 透支警示', cond:'当你透支、失衡、忽视它'}
  ] : [
    {tone:'light', title:'向阳 · 主动改变', cond:'当你主动改变、持续行动'},
    {tone:'warm', title:'主流 · 顺其自然', cond:'当你顺其自然、按部就班'},
    {tone:'dark', title:'警示 · 放任不管', cond:'当你回避、拖延、放任不管'}
  ];
}
function rankFor(tone, pos, len){
  if(tone==='light'){
    if(pos===0) return {label:'完美结局',cls:'perfect',emoji:'🌟'};
    if(pos===len-1) return {label:'隐藏结局',cls:'hidden',emoji:'🔒'};
    return {label:'好结局',cls:'good',emoji:'✨'};
  }
  if(tone==='warm') return {label:'普通结局',cls:'normal',emoji:'😐'};
  return pos===len-1 ? {label:'最坏结局',cls:'worst',emoji:'💀'} : {label:'坏结局',cls:'bad',emoji:'😰'};
}
function endingsHTML(top, pickable){
  if(pickable===undefined) pickable = true;
  const isGood = isGoodType(top);
  const flat = flatEndings(top);
  const cfg = groupConfig(isGood);
  const total = flat.reduce((s,e)=>s+e.prob, 0);
  const counters = {light:0, warm:0, dark:0};
  let rows = '';
  flat.forEach((e,i)=>{
    const pos = counters[e.group]++;
    const groupLen = flat.filter(x=>x.group===e.group).length;
    const c = cfg.find(x=>x.tone===e.group);
    if(pos===0){ rows += `<tr class="end-group"><td colspan="4">${c.title}</td></tr>`; }
    const r = rankFor(e.group, pos, groupLen);
    const pct = Math.max(2, Math.round(e.prob/total*100));
    rows += `
      <tr class="${pickable?'end-row':'end-row-static'} ${pickable&&reflect.picked===i?'sel':''}" ${pickable?`onclick="pickEnding(${i})"`:''}>
        <td><span class="rank-badge ${r.cls}">${r.emoji} ${r.label}</span><div class="end-prob-cell">约 ${pct}%</div></td>
        <td><span class="end-name">${e.title}</span></td>
        <td><span class="end-cond">${c.cond}</span></td>
        <td><div class="end-story-t">${e.story}</div></td>
      </tr>`;
  });
  return `
    <div class="r-card">
      <h3><span class="${isGood?'ic amber':'ic coral'}">🔮</span>${isGood?'你的光的 15 种结局':'你的雾的 15 种结局'}</h3>
      <div class="reflect-q">作为「${TYPE_CONTENT[top].tag}」，同龄人里大致会走向这 15 种结局${pickable?'——点选一行最戳你的，写下共鸣':''}。</div>
      <div class="end-scroll">
        <table class="end-table">
          <thead><tr><th>结局</th><th>名称</th><th>达成条件</th><th>结局走向（含案例）</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <p class="endings-note">* 概率为基于同龄人路径的启发式估计，非宿命；案例均为化名典型样本，如有雷同纯属巧合。路怎么走，握在你自己手里。</p>
    </div>`;
}

    </button>`).join('');
  return `
    <h3><span class="ic coral">💭</span>共鸣 · 反思</h3>
    <div class="reflect-q">哪一个结局最让你有共鸣？（可以是向往，也可以是害怕）</div>
    <div class="opts" id="reflectOpts" style="margin-bottom:14px">${opts}</div>
    <textarea id="reflectText" placeholder="为什么是它？写下你的感受，或想对自己说的一句话……" oninput="reflectInput(this.value)">${reflect.text}</textarea>
    <div class="nav"><button class="btn mint" id="reflectSubmit" ${reflect.picked===null?'disabled style="opacity:.45;cursor:not-allowed"':''} onclick="submitReflect()">写下我的共鸣 →</button></div>`;
}
function pickEnding(i){
  reflect.picked = (reflect.picked===i?null:i);
  document.querySelectorAll('tr.end-row').forEach((el,idx)=>{ el.classList.toggle('sel', idx===reflect.picked); });
  document.querySelectorAll('#reflectOpts .opt').forEach((el,idx)=>{ el.classList.toggle('sel', idx===reflect.picked); });
  const btn = document.getElementById('reflectSubmit');
  if(btn){ btn.disabled = (reflect.picked===null); btn.style.opacity = reflect.picked===null?'0.45':'1'; btn.style.cursor = reflect.picked===null?'not-allowed':'pointer'; }
}
function reflectInput(val){ reflect.text = val; }
function submitReflect(){
  reflect.text = (document.getElementById('reflectText')||{}).value || reflect.text;
  reflect.submitted = true;
  document.getElementById('reflectCard').innerHTML = reflectHTML(state.resultTop);
}

/* 启动 */
renderWelcome();
</script>
</body>
</html>
